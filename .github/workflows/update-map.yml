name: Update map data
on:
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC, right after Travian publishes map.sql at 00:00 UTC
    - cron: "40 0 * * *"   # retry
    - cron: "10 2 * * *"   # retry
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update map data" && git push)
      - name: Keep the Supabase project awake (free projects pause after a week of no use)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          c = json.load(open("config/supabase.json"))
          if c.get("url") and c.get("key"):
              r = urllib.request.Request(c["url"].rstrip("/") + "/rest/v1/shared?select=key&limit=1", headers={"apikey": c["key"]})
              print(urllib.request.urlopen(r, timeout=30).status)
          PY
