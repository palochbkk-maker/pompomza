name: Update map data
on:
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC, right after Travian publishes map.sql at 00:00 UTC
    - cron: "40 0 * * *"   # retry 00:40 UTC
    - cron: "10 2 * * *"   # retry 02:10 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update map data" && git push)
